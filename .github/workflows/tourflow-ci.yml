
name: TourFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - install and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: tourflow-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

  backend:
    name: Backend - Maven build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tourflow_db
          MYSQL_ROOT_PASSWORD: ci_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_test_only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test backend
        env:
          MYSQLHOST: 127.0.0.1
          MYSQLPORT: '3306'
          MYSQLDATABASE: tourflow_db
          MYSQLUSER: root
          MYSQLPASSWORD: ci_test_only
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Save backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: tourflow-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 3
